services:
  app:
    # This builds the Dockerfile in the current directory
    build: .
    # This is the name you want for your built image
    image: my-nextjs-app
    # This maps port 3000 on your computer to port 3000 in the container
    ports:
      - "3000:3000"
    # This is the magic part: it loads your .env file
    env_file:
      - .env.local