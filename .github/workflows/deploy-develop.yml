name: Build & Deploy HIS Frontend (Develop)

# The develop environment (his-fe-develop) was retired from the staging VPS on 2026-11-08; staging is the
# maintained branch. This workflow stays for a manual run only, in case a develop box comes back.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.DEV_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.DEV_NEXT_PUBLIC_APP_URL }}
          DOMAIN_URL: ${{ secrets.DEV_DOMAIN_URL }}
          # Demo mode is on until the backend is wired in; set the repo variable NEXT_PUBLIC_DEMO_MODE=false to turn it off.
          NEXT_PUBLIC_DEMO_MODE: ${{ vars.NEXT_PUBLIC_DEMO_MODE || 'true' }}
          # Domains the screens read/write for real (comma-separated); the rest stay on sample data.
          NEXT_PUBLIC_LIVE_DOMAINS: ${{ vars.NEXT_PUBLIC_LIVE_DOMAINS || 'property,reservation,folio,payment' }}
          NEXT_PUBLIC_DEMO_AUTH: ${{ vars.NEXT_PUBLIC_DEMO_AUTH || vars.NEXT_PUBLIC_DEMO_MODE || 'true' }}

      - name: Prepare standalone bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf standalone.tar.gz -C .next/standalone .

      - name: Copy bundle to server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The app lives under the deploy user's home: ~/apps/his-fe-develop. Create it on a fresh box.
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "${VPS_USER}@${VPS_HOST}" "mkdir -p apps/his-fe-develop"

          success=false
          for i in 1 2 3; do
            echo "SCP attempt $i..."
            if scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
              standalone.tar.gz "${VPS_USER}@${VPS_HOST}:apps/his-fe-develop/"; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          rm -f ~/.ssh/deploy_key

          if [ "$success" = false ]; then
            echo "All SCP attempts failed"
            exit 1
          fi

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/apps/his-fe-develop"
            cd "$APP_DIR"

            # First deploy on a box: create the systemd unit that runs the standalone server on port 3000.
            if ! systemctl cat his-fe-develop.service >/dev/null 2>&1; then
              echo "his-fe-develop.service not found - creating it"
              if ss -ltn 2>/dev/null | grep -q ':3000 '; then
                echo "Port 3000 is already in use by another process; stop it or change the port in the workflow"
                exit 1
              fi
              NODE_BIN="$(command -v node || true)"
              if [ -z "$NODE_BIN" ]; then
                echo "node is not on PATH for $USER; install Node or add it to PATH"
                exit 1
              fi
              printf '%s\n' \
                "[Unit]" \
                "Description=HIS frontend (develop)" \
                "After=network.target" \
                "" \
                "[Service]" \
                "Type=simple" \
                "User=$USER" \
                "WorkingDirectory=$APP_DIR/current" \
                "Environment=NODE_ENV=production" \
                "Environment=PORT=3000" \
                "Environment=HOSTNAME=0.0.0.0" \
                "ExecStart=$NODE_BIN server.js" \
                "Restart=always" \
                "RestartSec=5" \
                "" \
                "[Install]" \
                "WantedBy=multi-user.target" \
                | sudo tee /etc/systemd/system/his-fe-develop.service >/dev/null
              sudo systemctl daemon-reload
              sudo systemctl enable his-fe-develop.service
            fi

            # Backup current deployment
            if [ -d current ]; then
              rm -rf previous
              mv current previous
            fi

            # Extract new deployment
            mkdir -p current
            tar -xzf standalone.tar.gz -C current
            rm -f standalone.tar.gz

            # Stop service and force-release the port before starting fresh
            sudo systemctl stop his-fe-develop.service
            sleep 2
            sudo fuser -k 3000/tcp 2>/dev/null || true

            # Start service
            sudo systemctl start his-fe-develop.service
            sleep 5

            # Check if service started successfully
            if ! systemctl is-active --quiet his-fe-develop.service; then
              echo "Service failed to start - rolling back"
              if [ -d previous ]; then
                rm -rf current
                mv previous current
                sudo systemctl stop his-fe-develop.service
                sudo fuser -k 3000/tcp 2>/dev/null || true
                sudo systemctl start his-fe-develop.service
              fi
              exit 1
            fi

            echo "Develop deployment successful!"
            rm -rf previous
