name: Deploy Landing site (staging)

# One deploy per app. A change under apps/landing or packages/ redeploys this app; the other apps have their own workflow.
on:
  push:
    branches: [staging]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-landing-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build apps/landing
        working-directory: apps/landing
        run: bun run build
        env:
          DOMAIN_URL: ${{ secrets.STAGING_DOMAIN_URL }}
          NEXT_PUBLIC_HOTEL_APP_URL: ${{ vars.NEXT_PUBLIC_HOTEL_APP_URL || 'https://web-staging.hospio360.com' }}
          NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL || 'https://admin-staging.hospio360.com' }}

      # The standalone bundle is rooted at the workspace: apps/landing/server.js plus the hoisted node_modules.
      - name: Prepare standalone bundle
        run: |
          out=apps/landing/.next/standalone
          mkdir -p "$out/apps/landing/.next"
          cp -r apps/landing/.next/static "$out/apps/landing/.next/static"
          [ -d apps/landing/public ] && cp -r apps/landing/public "$out/apps/landing/public"
          tar -czf bundle.tar.gz -C "$out" .

      - name: Copy bundle to server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed, retrying in $((i*8))s"; sleep $((i*8)); done; return 1; }
          remote ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "$VPS_USER@$VPS_HOST" "mkdir -p apps/hospio-landing-staging"
          remote scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 bundle.tar.gz "$VPS_USER@$VPS_HOST:apps/hospio-landing-staging/bundle.tar.gz"
          rm -f ~/.ssh/deploy_key

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/apps/hospio-landing-staging"
            cd "$APP_DIR"

            # The unit is (re)written on every deploy so a layout change ships with the code.
            NODE_BIN="$(command -v node || true)"
            [ -n "$NODE_BIN" ] || { echo "node is not on PATH for $USER"; exit 1; }
            printf '%s\n' \
              "[Unit]" \
              "Description=Hospio360 Landing site (staging)" \
              "After=network.target" \
              "" \
              "[Service]" \
              "Type=simple" \
              "User=$USER" \
              "WorkingDirectory=$APP_DIR/current/apps/landing" \
              "Environment=NODE_ENV=production" \
              "Environment=PORT=3003" \
              "Environment=HOSTNAME=0.0.0.0" \
              "Environment=DOMAIN_URL=hospio360.com" \
              "ExecStart=$NODE_BIN $APP_DIR/current/apps/landing/server.js" \
              "Restart=always" \
              "RestartSec=5" \
              "" \
              "[Install]" \
              "WantedBy=multi-user.target" \
              | sudo tee /etc/systemd/system/hospio-landing-staging.service >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable -q hospio-landing-staging.service

            if [ -d current ]; then rm -rf previous; mv current previous; fi
            mkdir -p current
            tar -xzf bundle.tar.gz -C current
            rm -f bundle.tar.gz

            sudo systemctl stop hospio-landing-staging.service || true
            sleep 1
            sudo fuser -k 3003/tcp 2>/dev/null || true
            sudo systemctl start hospio-landing-staging.service
            for i in $(seq 1 20); do
              sleep 2
              if curl -fsS -o /dev/null "http://127.0.0.1:3003/"; then echo "Landing site is up on :3003"; rm -rf previous; exit 0; fi
            done
            echo "Landing site did not answer on :3003 — rolling back"
            journalctl -u hospio-landing-staging.service -n 40 --no-pager || true
            if [ -d previous ]; then rm -rf current; mv previous current; sudo systemctl restart hospio-landing-staging.service; fi
            exit 1
